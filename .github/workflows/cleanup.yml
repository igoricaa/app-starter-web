name: Cleanup

# Vercel-managed Neon deletes a preview's database branch only with its last Vercel deployment,
# months later, and the free plan caps branches.
# pull_request_target runs main's copy of this file, even for a PR closed with conflicts, and never
# checks out the PR's code. NEON_API_KEY (scoped to this Neon project) lives in the neon-cleanup
# environment, which only main may use, so a workflow added on a PR branch can't read it.
on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  neon-branch:
    # A fork's branch names could match ours.
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: neon-cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete preview/<head branch>, if it exists
        # Unlike the default, `bash` sets pipefail, so an API error fails the step.
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCHES: https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}/branches
          BRANCH: preview/${{ github.event.pull_request.head.ref }}
        run: |
          neon() { curl -fsS -H "Authorization: Bearer $NEON_API_KEY" "$@"; }
          id=$(neon "$BRANCHES" | jq -r --arg name "$BRANCH" '.branches[] | select(.name == $name) | .id')
          if [ -z "$id" ]; then echo "No branch $BRANCH"; exit 0; fi
          neon -X DELETE "$BRANCHES/$id" >/dev/null
          echo "Deleted $BRANCH"
